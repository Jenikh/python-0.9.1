name: Build Python 0.9.1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.9.1"
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        type: boolean
        default: false

concurrency:
  group: python-0.9.1-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C src -f Makefile
      - name: Smoke test
        run: printf 'print 1+1\n' | ./src/python
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-0.9.1-linux
          path: src/python

  windows:
    name: Windows (UCRT64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
      - name: Build
        shell: msys2 {0}
        run: mingw32-make -C "$GITHUB_WORKSPACE/src" -f Makefile.win32
      - name: Smoke test
        shell: msys2 {0}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/lib"
          printf 'print 1+1\n' | ./src/python.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-0.9.1-windows
          path: src/python.exe

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake
          run: |
            cd "$GITHUB_WORKSPACE/src"
            gmake CFLAGS='-DSYSV -Wno-error' -f Makefile
            printf 'print 1+1\n' | ./python

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          prepare: |
            pkg_add gmake
          run: |
            cd "$GITHUB_WORKSPACE/src"
            gmake CFLAGS='-DSYSV -Wno-error' -f Makefile
            printf 'print 1+1\n' | ./python

  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add -u gmake
          run: |
            cd "$GITHUB_WORKSPACE/src"
            gmake CFLAGS='-DSYSV -Wno-error' -f Makefile
            printf 'print 1+1\n' | ./python


  release:
    name: Create GitHub Release
    needs: [linux, windows, freebsd, openbsd, netbsd]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp release/python-0.9.1-linux/python release-files/python-0.9.1-linux
          cp release/python-0.9.1-windows/python.exe release-files/python-0.9.1-windows.exe
          cp release/python-0.9.1-freebsd/python release-files/python-0.9.1-freebsd
          cp release/python-0.9.1-openbsd/python release-files/python-0.9.1-openbsd
          cp release/python-0.9.1-netbsd/python release-files/python-0.9.1-netbsd

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" release-files/* \
            --title "Python 0.9.1" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
